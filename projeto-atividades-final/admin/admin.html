<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo</title>
    <link rel="stylesheet" href="../login/login.css">
    <link rel="shortcut icon" href="../img/logo.jpeg" type="image/x-icon">
</head>
<body>
    <div class="container">
        <nav>
            <h2>Painel Admin</h2>
            <button class="logout-btn" onclick="logout()">Sair</button>
        </nav>

        <div class="card">
            <h3>Cadastrar Novo Usuário</h3>
            <form id="registerForm">
                <input type="text" id="regName" placeholder="Nome Completo" required>
                <input type="email" id="regEmail" placeholder="E-mail" required>
                <input type="password" id="regPass" placeholder="Senha" required>
                <select id="regRole" required>
                    <option value="student">Aluno</option>
                    <option value="teacher">Professor</option>
                </select>
                <button type="submit">Cadastrar</button>
            </form>
        </div>

        <div class="card">
            <h3>Usuários Cadastrados</h3>
            <div id="usersList">Carregando...</div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
